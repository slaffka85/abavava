<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Личные и групповые чаты, голосовые и видеозвонки." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Abavava" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon.svg" />
    <title>abavava</title>
  </head>
  <body>
  <div id="mobile-debug-console" style="position:fixed; bottom:0; left:0; width:100%; max-height:200px; overflow-y:auto; background:rgba(0,0,0,0.9); color:#ff5555; font-family:monospace; font-size:12px; z-index:999999; padding:10px; box-sizing:border-box; pointer-events:none;">
    <strong>Логи и Ошибки:</strong><br>
  </div>

  <script>
    (function() {
      const consoleDiv = document.getElementById('mobile-debug-console');

      function logToScreen(message, isError = false) {
        const line = document.createElement('div');
        line.style.color = isError ? '#ff5555' : '#55ff55';
        line.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
        consoleDiv.appendChild(line);
        consoleDiv.scrollTop = consoleDiv.scrollHeight; // Прокрутка вниз
      }

      // Перехват обычных ошибок JS
      window.onerror = function(msg, url, line) {
        logToScreen(`Ошибка: ${msg} (Строка: ${line})`, true);
        return false;
      };

      // Перехват неотловленных промисов (часто бывает в WebRTC)
      window.onunhandledrejection = function(event) {
        logToScreen(`Ошибка промиса: ${event.reason}`, true);
      };

      // Перехватываем стандартный console.log и console.error для вывода на экран
      const oldLog = console.log;
      console.log = function(...args) {
        oldLog.apply(console, args);
        logToScreen(args.join(' '), false);
      };

      const oldError = console.error;
      console.error = function(...args) {
        oldError.apply(console, args);
        logToScreen(args.join(' '), true);
      };

      logToScreen('Самодельная консоль запущена успешно!');
    })();
  </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
