name: Build and deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run backend tests
        run: mvn --batch-mode verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abavava-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abavava-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Install SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy production Compose files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            compose.prod.yaml .env.production.example \
            "$VPS_USER@$VPS_HOST:/opt/abavava/"

      - name: Pull and restart production stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/abavava-api:${{ github.sha }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/abavava-web:${{ github.sha }}
        run: |
          printf 'ABV_API_IMAGE=%s\nABV_WEB_IMAGE=%s\n' "$API_IMAGE" "$WEB_IMAGE" \
            | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              'umask 077; cat > /opt/abavava/.deploy.env'
          printf '%s\n%s' "$GHCR_READ_USER" "$GHCR_READ_TOKEN" \
            | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
              'IFS= read -r login_user; docker login ghcr.io --username "$login_user" --password-stdin'
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/abavava && docker compose --env-file .env.production --env-file .deploy.env -f compose.prod.yaml pull && docker compose --env-file .env.production --env-file .deploy.env -f compose.prod.yaml up -d --remove-orphans && docker logout ghcr.io'
